name: watchme_testkit
description: >-
  Test support for watchme: fake transports, a fake clock, matchers, and
  loopback Roku and Fire TV protocol simulators (`dart run
  watchme_testkit:sim`).
version: 0.1.0
repository: https://github.com/fingerskier/watchme
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  crypto: ^3.0.6
  test: ^1.25.0
  watchme_core: ^0.1.0
  xml: ^7.1.0
